name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select a Swift 6.2 Xcode toolchain
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then
            echo "No Xcode 26 installation is available on this runner" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          swift --version

      - name: Build
        run: swift build -c debug

      - name: Run test suite
        run: swift run -c debug middleai-tests
