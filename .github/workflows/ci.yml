name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select a Swift 6.2 Xcode toolchain
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "$xcode_path" ]]; then
            echo "No Xcode 26 installation is available on this runner" >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          swift --version

      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swift62-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift62-

      - name: Lint Swift formatting
        run: swift format lint --recursive Sources Tests Package.swift

      - name: Audit repository policy
        run: ./scripts/audit-repository.sh

      - name: Build
        run: swift build -c debug

      - name: Run test suite
        run: swift run -c debug middleai-tests

      - name: Run structured Swift tests with coverage
        run: swift test -c debug --enable-code-coverage

      - name: Build and verify application bundle
        env:
          MIDDLEAI_BUILD_ARCH: arm64
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep --strict --verbose=2 dist/MiddleAI.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/MiddleAI.app/Contents/Info.plist)" = "de.middleai.app"
