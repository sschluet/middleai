<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070911">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <title>Seite nicht gefunden – MiddleAI</title>
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 30px; text-align: center; }
      .not-found img { width: 110px; margin: 0 auto 28px; border-radius: 26px; }
      .not-found h1 { margin-bottom: 18px; font-size: clamp(52px, 10vw, 92px); }
      .not-found p { max-width: 500px; margin: 0 auto 28px; color: #9ea6ba; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="assets/middleai-icon.png" alt="MiddleAI App-Icon">
        <h1>404<span>.</span></h1>
        <p>Diese Seite gibt es nicht. MiddleAI bringt dich zurück zur Produktübersicht.</p>
        <a class="button button-primary" href="./">Zur Startseite</a>
      </div>
    </main>
  </body>
</html>
